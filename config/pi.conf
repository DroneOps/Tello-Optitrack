[GAINS]
# Proportional gains (Kp): map meters of error directly to RC commands (-100 to 100).
Kp_x = 40.0
Kp_y = 40.0
Kp_z = 60.0

# Integral gains (Ki): eliminate steady-state error (friction/drift).
Ki_x = 10.0
Ki_y = 10.0
Ki_z = 15.0

# Anti-Windup: Maximum allowable integral accumulation (to prevent runaway speeds)
# This limits the maximum effect the I-term can have.
max_integral = 2.0
